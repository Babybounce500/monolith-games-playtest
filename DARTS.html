<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEURAL DARTS // PRO EDITION</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #060911;
      --panel: #0d1322;
      --accent: #00f3ff;
      --accent-glow: rgba(0, 243, 255, 0.4);
      --red-peg: #ff0055;
      --text: #ffffff;
      --subtext: #94a3b8;
      --success: #39ff14;
      --card-bg: rgba(255, 255, 255, 0.05);
      --btn-bg: #1e293b;
      --border-color: #334155;
      
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    :root.light-mode {
      --bg: #e2e8f0;
      --panel: #ffffff;
      --accent: #0077cc;
      --accent-glow: rgba(0, 119, 204, 0.25);
      --red-peg: #d90429;
      --text: #0f172a;
      --subtext: #475569;
      --success: #16a34a;
      --card-bg: #f1f5f9;
      --btn-bg: #cbd5e1;
      --border-color: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    header {
      width: 100%;
      max-width: 450px;
      margin-bottom: 8px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
      background: var(--panel);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent-glow);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 4px;
    }

    #game-container {
      background: var(--panel);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-controls {
      display: flex;
      gap: 4px;
      justify-content: space-between;
    }

    .mode-btn {
      flex: 1;
      padding: 8px 2px;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 800;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-align: center;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      background: var(--card-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      max-height: 170px;
      overflow-y: auto;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid transparent;
      padding: 8px;
      border-radius: 6px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .player-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .player-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-score {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text);
    }

    .player-sets-legs {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 2px 0;
      font-weight: bold;
    }

    .player-stats {
      font-size: 0.65rem;
      color: var(--subtext);
      display: flex;
      justify-content: space-around;
      margin-top: 2px;
      font-weight: bold;
    }

    .checkout-guide {
      background: rgba(57, 255, 20, 0.12);
      border: 1px solid var(--success);
      color: var(--success);
      font-family: 'Orbitron', sans-serif;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 900;
      min-height: 28px;
    }

    .pro-input-container {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
    }

    .pro-input {
      flex: 1;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px;
      border-radius: 6px;
      text-align: center;
      outline: none;
    }

    .pro-btn {
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      padding: 0 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    .turn-history {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: bold;
      border: 1px solid var(--border-color);
    }

    .dart-list { display: flex; gap: 6px; }

    .dart-badge {
      background: var(--btn-bg);
      color: var(--text);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      font-size: 0.75rem;
      font-weight: bold;
    }

    .keypad-modifiers {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mod-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      padding: 8px 0;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mod-btn.selected {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .num-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      font-family: 'Orbitron', sans-serif;
      padding: 10px 0;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .action-btn {
      background: linear-gradient(135deg, var(--accent), #0066ff);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
    }

    .icon-btn {
      padding: 4px 8px;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .icon-btn.active-music {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 10px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent);
      font-size: 1.1rem;
      text-align: center;
    }

    .modal-body {
      font-size: 0.85rem;
      color: var(--text);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .setting-group {
      background: var(--card-bg);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .setting-select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-color);
      padding: 8px;
      border-radius: 6px;
      font-family: 'Share Tech Mono', monospace;
      outline: none;
    }

    .player-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }

    .remove-p-btn {
      background: var(--red-peg);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      html, body { overscroll-behavior: none; }
      body {
        min-height: 100dvh;
        padding: calc(6px + var(--sat)) calc(6px + var(--sar)) calc(6px + var(--sab)) calc(6px + var(--sal));
      }
      .mode-btn, .mod-btn { min-height: 44px; display: flex; align-items: center; justify-content: center; }
      .num-btn { min-height: 46px; display: flex; align-items: center; justify-content: center; }
      .action-btn { min-height: 48px; display: flex; align-items: center; justify-content: center; }
      .pro-input { font-size: 16px; }
      .modal-card { max-height: 85dvh; }
    }

    @supports (-webkit-touch-callout: none) {
      .scoreboard, .modal-card { -webkit-overflow-scrolling: touch; }
    }
    /* SCAN-AI */
    .camera-btn { background: var(--btn-bg); border: 1px solid var(--accent); color: var(--accent); padding: 0 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .scan-status { font-size: 0.7rem; color: var(--subtext); min-height: 1.1em; text-align: center; margin: 2px 0 4px; font-family: 'Share Tech Mono', monospace; }
    .scan-status.warn { color: #f59e0b; }
    .scan-status.bad { color: var(--red-peg); }
    @media (max-width: 480px) {
      .header-controls { gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
      .header-controls .icon-btn { padding: 6px 7px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <h1>NEURAL DARTS</h1>
      <div class="header-controls">
        <button class="icon-btn" onclick="openStatsModal()">📊 STATS</button>
        <button class="icon-btn" onclick="openPlayerModal()">⚙️ MATCH</button>
        <button class="icon-btn" onclick="openTournament()" title="Turnier">🏆</button>
        <button class="icon-btn" onclick="openTrainer()" title="Checkout-Trainer">🎯</button>
        <button class="icon-btn" onclick="openVoiceSettings()" title="Sprache und Stimme">🗣</button>
        <button class="icon-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
        <button class="icon-btn" id="keynote-btn" onclick="toggleKeynoteTrack()">🎵</button>
        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </header>

  <div id="game-container">
    <div class="top-controls">
      <button class="mode-btn active" id="m-501" onclick="selectMode('501')">501</button>
      <button class="mode-btn" id="m-301" onclick="selectMode('301')">301</button>
      <button class="mode-btn" id="m-cricket" onclick="selectMode('cricket')">CRICKET</button>
      <button class="mode-btn" id="m-atc" onclick="selectMode('atc')">ATC</button>
    </div>

    <div class="scoreboard" id="scoreboard"></div>

    <div class="checkout-guide" id="checkout-guide">CHECKOUT: ---</div>

    <div class="pro-input-container">
      <input type="number" pattern="[0-9]*" inputmode="numeric" id="pro-score-input" class="pro-input" placeholder="PRO: SUMME (0-180)" min="0" max="180">
      <button class="pro-btn" onclick="submitProScore()">ENTER</button>
      <button class="camera-btn" onclick="document.getElementById('scan-file').click()" title="Foto der Scheibe">📷</button>
      <input type="file" id="scan-file" accept="image/*" capture="environment" style="display:none" onchange="scanDartsPhoto(this)">
    </div>

    <div class="scan-status" id="scan-status"></div>
    <div class="turn-history">
      <span>TURN: <strong id="turn-score" style="color:var(--accent);">0</strong></span>
      <div class="dart-list" id="dart-list">
        <span class="dart-badge">-</span>
        <span class="dart-badge">-</span>
        <span class="dart-badge">-</span>
      </div>
      <button class="icon-btn" style="color:var(--red-peg);" onclick="smartUndo()">↩ UNDO</button>
    </div>

    <div class="keypad-modifiers">
      <button class="mod-btn selected" id="mod-S" onclick="setMultiplier('S')">SINGLE</button>
      <button class="mod-btn" id="mod-D" onclick="setMultiplier('D')">DOUBLE</button>
      <button class="mod-btn" id="mod-T" onclick="setMultiplier('T')">TRIPLE</button>
    </div>

    <div class="keypad-grid" id="keypad"></div>

    <button class="action-btn" id="submit-turn-btn" onclick="confirmTurn()">NEXT PLAYER</button>
  </div>

  <!-- STATS MODAL -->
  <div class="modal-overlay" id="stats-modal">
    <div class="modal-card">
      <div class="modal-title">DEEP MATCH STATS</div>
      <div class="modal-body" id="stats-content"></div>
      <button class="action-btn" onclick="closeModals()">SCHLIESSEN</button>
    </div>
  </div>

  <!-- MATCH & PLAYER SETTINGS MODAL -->
  <div class="modal-overlay" id="trainer-modal">
    <div class="modal-card">
      <div class="modal-title">CHECKOUT-TRAINER</div>
      <div class="modal-body" id="trainer-body"></div>
    </div>
  </div>

  <div class="modal-overlay" id="tournament-modal">
    <div class="modal-card">
      <div class="modal-title">TURNIER</div>
      <div class="modal-body" id="tournament-body"></div>
    </div>
  </div>

  <div class="modal-overlay" id="calib-modal">
    <div class="modal-card">
      <div class="modal-title">SCHEIBE KALIBRIEREN</div>
      <div class="modal-body">
        <div id="calib-hint" style="font-size:0.8rem;margin-bottom:6px;"></div>
        <canvas id="calib-canvas" onclick="calibTap(event)" style="width:100%;height:auto;border-radius:6px;touch-action:manipulation;"></canvas>
        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
          <button class="icon-btn" id="calib-go" onclick="runScan(true)" disabled>Mit Kalibrierung scannen</button>
          <button class="icon-btn" onclick="runScan(false)">Automatisch (KI)</button>
          <button class="icon-btn" onclick="closeModals()">Abbrechen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="preview-modal">
    <div class="modal-card">
      <div class="modal-title">ERKANNTE PFEILE</div>
      <div class="modal-body">
        <canvas id="preview-canvas" style="width:100%;height:auto;border-radius:6px;"></canvas>
        <div id="preview-status" style="font-size:0.8rem;margin:8px 0;"></div>
        <div id="preview-list"></div>
        <div id="preview-total" style="font-size:0.9rem;margin:6px 0;"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="icon-btn" id="preview-apply" onclick="applyPreview(false)">Übernehmen</button>
          <button class="icon-btn" id="preview-commit" onclick="applyPreview(true)">Übernehmen &amp; eintragen</button>
          <button class="icon-btn" onclick="rescanFromPreview()">Neu scannen</button>
          <button class="icon-btn" onclick="closeModals()">Verwerfen</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="player-modal">
    <div class="modal-card">
      <div class="modal-title">MATCH SETUP</div>
      <div class="modal-body">
        
        <div class="setting-group">
          <div class="setting-label">MATCH FORMAT</div>
          <div style="display:flex; gap:8px;">
            <div style="flex:1;">
              <label style="font-size:0.65rem; color:var(--subtext);">FIRST TO LEGS:</label>
              <select id="target-legs" class="setting-select" style="width:100%;">
                <option value="1">1 Leg</option>
                <option value="2">2 Legs</option>
                <option value="3" selected>3 Legs</option>
                <option value="5">5 Legs</option>
              </select>
            </div>
            <div style="flex:1;">
              <label style="font-size:0.65rem; color:var(--subtext);">FIRST TO SETS:</label>
              <select id="target-sets" class="setting-select" style="width:100%;">
                <option value="1" selected>1 Set</option>
                <option value="2">2 Sets</option>
                <option value="3">3 Sets</option>
                <option value="5">5 Sets</option>
              </select>
            </div>
          </div>
        </div>

        <div class="setting-group">
          <div class="setting-label">ANSAGE</div>
          <div style="display:flex; gap:8px;">
            <div style="flex:1;">
              <label style="font-size:0.65rem; color:var(--subtext);">SPRACHE:</label>
              <select id="voice-lang" class="setting-select" style="width:100%;" onchange="populateVoiceSelect(this.value)"></select>
            </div>
            <div style="flex:1;">
              <label style="font-size:0.65rem; color:var(--subtext);">STIMME:</label>
              <select id="voice-name" class="setting-select" style="width:100%;" onchange="setVoiceName(this.value)"></select>
            </div>
          </div>
          <button class="icon-btn" style="margin-top:8px;" onclick="previewVoice()">▶ TEST</button>
        </div>

        <div class="setting-group">
          <div class="setting-label">BOT-GEGNER</div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <label style="font-size:0.75rem;"><input type="checkbox" id="bot-on" onchange="setBotOn(this.checked)"> Bot mitspielen</label>
            <select id="bot-skill" class="setting-select" onchange="setBotSkill(this.value)">
              <option value="leicht">Leicht</option>
              <option value="mittel">Mittel</option>
              <option value="schwer">Schwer</option>
            </select>
          </div>
          <div style="font-size:0.6rem; color:var(--subtext); margin-top:4px;">Gilt ab dem nächsten Match (MATCH STARTEN)</div>
        </div>

        <div class="setting-label">SPIELER VERWALTUNG</div>
        <div id="player-inputs-container" style="display:flex; flex-direction:column; gap:6px;"></div>

        <button class="action-btn" style="background:var(--btn-bg); border:1px solid var(--accent); color:var(--accent);" onclick="addPlayerField()">+ SPIELER HINZUFÜGEN</button>
        <button class="action-btn" onclick="saveMatchSettings()">MATCH STARTEN / SPEICHERN</button>
        <button class="action-btn" style="background:#475569;" onclick="resetToGuests()">RESET ALL</button>
        <button class="action-btn" style="background:transparent; border:1px solid var(--border-color); color:var(--text);" onclick="closeModals()">ABBRECHEN</button>
      </div>
    </div>
  </div>

  <script>
    const CHECKOUTS = {
      170: "T20 T20 BULL", 167: "T20 T19 BULL", 164: "T20 T18 BULL", 161: "T20 T17 BULL",
      160: "T20 T20 D20", 120: "T20 20 D20", 100: "T20 D20", 80: "T20 D10", 60: "20 D20",
      40: "D20", 32: "D16", 16: "D8", 8: "D4", 4: "D2", 2: "D1"
    };

    let gameMode = '501';
    let soundEnabled = true;
    let voiceLang = localStorage.getItem('neural_voice_lang') || '';
    let voiceURI = localStorage.getItem('neural_voice_uri') || '';
    let activePlayer = 0;
    let startingPlayerOfLeg = 0;
    let multiplier = 'S';
    let turnDarts = [];
    let turnHistory = [];
    let matchLog = [];
    let legNo = 1;

    let targetLegs = 3;
    let targetSets = 1;

    let players = [];
    let tempPlayerNames = [];

    function init() {
      loadStoredSettings();
      renderKeypad();
      resetMatch();
      if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = loadVoiceLanguages;
      loadVoiceLanguages();

      document.getElementById('pro-score-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') submitProScore();
      });
    }

    const MUSIC_ROOT = 'https://gaming-ai.replit.app/0-MUKKE-GAMELPLAY/';
    const MUSIC_TRACKS = ['Climbing Clear.mp3','Deep Sonar.mp3','Haupt-Exploration.mp3','Marimba Grid.mp3','Neon Velocity.mp3','Sandal Tide.mp3','Whiteout Discovery.mp3'];
    let musicAudio = null;
    let musicIdx = Math.floor(Math.random() * MUSIC_TRACKS.length);

    function playMusicTrack() {
      if (!musicAudio) {
        musicAudio = new Audio();
        musicAudio.volume = 0.35;
        musicAudio.addEventListener('ended', () => {
          musicIdx = (musicIdx + 1) % MUSIC_TRACKS.length;
          playMusicTrack().catch(() => {});
        });
      }
      musicAudio.src = MUSIC_ROOT + encodeURIComponent(MUSIC_TRACKS[musicIdx]);
      return musicAudio.play();
    }

    function toggleKeynoteTrack() {
      const btn = document.getElementById('keynote-btn');
      if (musicAudio && !musicAudio.paused) {
        musicAudio.pause();
        btn.classList.remove('active-music');
        return;
      }
      const start = musicAudio && musicAudio.src ? musicAudio.play() : playMusicTrack();
      start.then(() => btn.classList.add('active-music')).catch(e => { if (e.name !== 'AbortError') console.log('Audio play blocked', e); });
    }

    function loadStoredSettings() {
      const savedPlayers = localStorage.getItem('neural_players_list');
      tempPlayerNames = savedPlayers ? JSON.parse(savedPlayers) : ["GUEST 1", "GUEST 2"];
      
      const savedLegs = localStorage.getItem('neural_target_legs');
      if (savedLegs) targetLegs = parseInt(savedLegs);
      
      const savedSets = localStorage.getItem('neural_target_sets');
      if (savedSets) targetSets = parseInt(savedSets);

      document.getElementById('target-legs').value = targetLegs;
      document.getElementById('target-sets').value = targetSets;

      buildPlayersArray();
    }

    let botOn = localStorage.getItem('neural_bot') === '1';
    let botSkill = localStorage.getItem('neural_bot_skill') || 'mittel';
    let botBusy = false;
    let matchStartTs = null;
    let trainerTarget = 0, trainerOk = 0, trainerTries = 0;
    const BOT_SKILL = {
      leicht: { hit: 0.45, treble: 0.1, aimAny: true },
      mittel: { hit: 0.65, treble: 0.4, aimAny: false },
      schwer: { hit: 0.85, treble: 0.6, aimAny: false }
    };
    const CRICKET_NUMS = [20, 19, 18, 17, 16, 15, 25];
    const ATC_ORDER = [...Array.from({ length: 20 }, (_, i) => i + 1), 25];
    const PALETTE = ['#a78bfa', '#34d399', '#f59e0b', '#f472b6', '#60a5fa', '#f87171'];

    function crickBlank() {
      return Object.fromEntries(CRICKET_NUMS.map(n => [n, 0]));
    }

    function buildPlayersArray() {
      const startScore = gameMode === '301' ? 301 : 501;
      const list = tempPlayerNames.map(name => ({ name, bot: false }));
      if (botOn) list.push({ name: 'BOT', bot: true });
      players = list.map(({ name, bot }) => ({
        name,
        bot,
        score: startScoreFor(name),
        legs: 0,
        sets: 0,
        dartsThrown: 0,
        totalScored: 0,
        highestTurn: 0,
        points: 0,
        cricket: crickBlank(),
        atcTarget: 1,
        atcDone: false
      }));
    }

    function crickNum(label) {
      if (label === 'BULL' || label === 'D-BULL') return 25;
      const m = label.match(/^[TD]?(\d+)$/);
      return m ? Number(m[1]) : 0;
    }

    function crickMarks(label) {
      if (label === 'D-BULL') return 2;
      if (label.startsWith('T')) return 3;
      if (label.startsWith('D')) return 2;
      return 1;
    }

    function applyCricket(p, labels) {
      for (const l of labels) {
        if (l.startsWith('PRO:') || l === 'MISS') continue;
        const n = crickNum(l);
        if (!CRICKET_NUMS.includes(n)) continue;
        for (let m = crickMarks(l); m > 0; m--) {
          if (p.cricket[n] < 3) p.cricket[n]++;
          else if (players.some(o => o !== p && o.cricket[n] < 3)) p.points += n;
        }
      }
    }

    function crickWon(p) {
      return CRICKET_NUMS.every(n => p.cricket[n] >= 3) && players.every(o => o === p || p.points >= o.points);
    }

    function crickLine(p) {
      const sym = v => v >= 3 ? '✔' : v === 2 ? 'XX' : v === 1 ? 'X' : '·';
      return CRICKET_NUMS.map(n => `<span>${n === 25 ? 'B' : n}:${sym(p.cricket[n])}</span>`).join(' ');
    }

    function applyAtc(p, labels) {
      for (const l of labels) {
        if (p.atcDone) break;
        if (l.startsWith('PRO:') || l === 'MISS') continue;
        if (crickNum(l) === ATC_ORDER[p.atcTarget - 1]) p.atcTarget++;
        if (p.atcTarget > ATC_ORDER.length) p.atcDone = true;
      }
    }

    function atcLabel(p) {
      if (p.atcDone) return '✔';
      const n = ATC_ORDER[p.atcTarget - 1];
      return n === 25 ? 'BULL' : String(n);
    }

    function scheduleBot() {
      const p = players[activePlayer];
      if (!p || !p.bot || botBusy) return;
      botBusy = true;
      setTimeout(() => {
        botBusy = false;
        if (players[activePlayer] && players[activePlayer].bot) botThrow();
      }, 900);
    }

    function botAim(p, cfg) {
      if (gameMode === 'atc') return ATC_ORDER[p.atcTarget - 1];
      if (gameMode === 'cricket') {
        const open = CRICKET_NUMS.filter(n => p.cricket[n] < 3);
        if (open.length) return open[Math.floor(Math.random() * open.length)];
        return CRICKET_NUMS[Math.floor(Math.random() * CRICKET_NUMS.length)];
      }
      if (cfg.aimAny) return 1 + Math.floor(Math.random() * 20);
      return Math.random() < 0.75 ? 20 : 19;
    }

    function botThrow() {
      const cfg = BOT_SKILL[botSkill] || BOT_SKILL.mittel;
      const p = players[activePlayer];
      turnDarts = [];
      for (let i = 0; i < 3; i++) {
        if (Math.random() > cfg.hit) { turnDarts.push({ score: 0, label: 'MISS' }); continue; }
        const n = botAim(p, cfg);
        const r = Math.random();
        const mult = (n === 25) ? (r < 0.5 ? 2 : 1) : (r < cfg.treble ? 3 : (r < cfg.treble + 0.15 ? 2 : 1));
        if (n === 25) {
          turnDarts.push(mult === 2 ? { score: 50, label: 'D-BULL' } : { score: 25, label: 'BULL' });
        } else {
          turnDarts.push({ score: n * mult, label: (mult === 3 ? 'T' : mult === 2 ? 'D' : '') + n });
        }
      }
      updateTurnUI();
      confirmTurn();
    }

    function setBotOn(v) {
      botOn = v;
      localStorage.setItem('neural_bot', v ? '1' : '0');
    }

    function setBotSkill(v) {
      botSkill = v;
      localStorage.setItem('neural_bot_skill', v);
    }

    function loadProfiles() {
      try { return JSON.parse(localStorage.getItem('neural_profiles')) || {}; } catch (e) { return {}; }
    }

    function saveProfile(name, patch) {
      const pr = loadProfiles();
      pr[name] = { ...(pr[name] || {}), ...patch };
      try { localStorage.setItem('neural_profiles', JSON.stringify(pr)); } catch (e) {}
    }

    function playerColor(idx) {
      const p = players[idx];
      const pr = p ? loadProfiles()[p.name] || {} : {};
      return pr.color || PALETTE[idx % PALETTE.length];
    }

    function loadElo() {
      try { return JSON.parse(localStorage.getItem('neural_elo')) || {}; } catch (e) { return {}; }
    }

    function updateElo(winnerName, loserNames) {
      const elo = loadElo();
      const R = n => elo[n] ?? 1000;
      const rw = R(winnerName);
      const deltas = {};
      loserNames.forEach(l => {
        const e = 1 / (1 + Math.pow(10, (R(l) - rw) / 400));
        const d = 32 * (1 - e);
        deltas[winnerName] = (deltas[winnerName] || 0) + d;
        deltas[l] = (deltas[l] || 0) - d;
      });
      for (const [n, d] of Object.entries(deltas)) elo[n] = Math.round(R(n) + d);
      try { localStorage.setItem('neural_elo', JSON.stringify(elo)); } catch (e) {}
    }

    function h2h(a, b) {
      let wa = 0, wb = 0;
      for (const h of loadMatchHistory()) {
        const names = h.players.map(p => p.name);
        if (!names.includes(a) || !names.includes(b)) continue;
        if (h.winner === a) wa++;
        else if (h.winner === b) wb++;
      }
      return { wa, wb };
    }

    function profileStats(name) {
      let matches = 0, wins = 0, avgSum = 0, t180 = 0, t100 = 0;
      const nums = {};
      for (const h of loadMatchHistory()) {
        for (const p of h.players) {
          if (p.name !== name) continue;
          matches++;
          if (h.winner === name) wins++;
          avgSum += Number(p.avg) || 0;
          t180 += p.t180 || 0;
          t100 += p.t100 || 0;
          for (const [k, c] of Object.entries(p.nums || {})) nums[k] = (nums[k] || 0) + c;
        }
      }
      return { matches, wins, avg: matches ? (avgSum / matches).toFixed(1) : '–', t180, t100, top: topNumbers(nums) };
    }

    function topNumbers(nums) {
      return Object.entries(nums).sort((a, b) => b[1] - a[1]).slice(0, 3)
        .map(([k, c]) => `${k == 25 ? 'Bull' : k}×${c}`).join(', ') || '–';
    }

    function downloadBlob(name, blob) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function exportCsv() {
      const rows = [['turn', 'leg', 'player', 'start', 'points', 'darts', 'bust', 'won']];
      matchLog.forEach((e, i) => rows.push([i + 1, e.leg, players[e.p]?.name ?? e.p, e.start, e.pts, e.labels.join(' '), e.bust, e.won]));
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      downloadBlob('darts-match.csv', new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    }

    function matchSummaryText() {
      const lines = ['NEURAL DARTS · ' + gameMode.toUpperCase() + ' · ' + new Date().toLocaleDateString('de-DE')];
      players.forEach((p, idx) => {
        const s = playerStats(idx);
        lines.push(`${p.name}: Sets ${p.sets} · Legs ${p.legs} · Avg ${avgOf(p)} · First-9 ${s.first9} · 180er ${s.t180} · Top ${topNumbers(s.nums)}`);
      });
      return lines.join('\n');
    }

    async function copySummary() {
      const t = matchSummaryText();
      try {
        await navigator.clipboard.writeText(t);
        alert('In die Zwischenablage kopiert.');
      } catch (e) {
        prompt('Zum Kopieren markieren:', t);
      }
    }

    function saveSummaryImage() {
      const lines = matchSummaryText().split('\n');
      const c = document.createElement('canvas');
      c.width = 1000;
      c.height = 120 + lines.length * 50;
      const g = c.getContext('2d');
      g.fillStyle = '#0d0b1a';
      g.fillRect(0, 0, c.width, c.height);
      g.fillStyle = '#67e8f9';
      g.font = 'bold 30px monospace';
      g.fillText(lines[0], 30, 56);
      g.font = '22px monospace';
      lines.slice(1).forEach((l, i) => {
        g.fillStyle = i % 2 ? '#94a3b8' : '#e2e8f0';
        g.fillText(l, 30, 120 + i * 50);
      });
      c.toBlob(b => downloadBlob('darts-match.png', b));
    }

    function labelPos(label) {
      if (label === 'BULL' || label === 'D-BULL') return { x: 0, y: 0 };
      const m = label.match(/^([TD]?)(\d+)$/);
      if (!m) return null;
      const idx = SCAN_ORDER.indexOf(Number(m[2]));
      if (idx < 0) return null;
      const r = m[1] === 'T' ? 0.6055 : m[1] === 'D' ? 0.976 : 0.34;
      const phi = idx * Math.PI / 10 - Math.PI / 2;
      return { x: r * Math.cos(phi), y: r * Math.sin(phi) };
    }

    function heatmapSvg(dots) {
      if (!dots.length) return '<div style="font-size:0.75rem;color:var(--subtext);">Noch keine Würfe</div>';
      return `<svg viewBox="-110 -110 220 220" width="220" height="220" style="display:block;margin:0 auto;">
        <circle r="100" fill="#1a1a2e" stroke="#555"/>
        <circle r="95.3" fill="none" stroke="#555"/><circle r="58.2" fill="none" stroke="#555"/>
        <circle r="62.9" fill="none" stroke="#555"/><circle r="9.35" fill="none" stroke="#555"/>
        ${dots.map(d => `<circle cx="${(d.x * 100).toFixed(1)}" cy="${(d.y * 100).toFixed(1)}" r="3" fill="${d.c}" opacity="0.85"/>`).join('')}
      </svg>`;
    }

    function currentMatchDots() {
      const dots = [];
      matchLog.forEach(e => e.labels.forEach((l, i) => {
        const q = (e.pos && e.pos[i]) || labelPos(l);
        if (q) dots.push({ x: q.x, y: q.y, c: playerColor(e.p) });
      }));
      return dots;
    }

    function playerDots(name) {
      const dots = [];
      const color = (loadProfiles()[name] || {}).color || PALETTE[0];
      for (const h of loadMatchHistory()) {
        for (const p of h.players) {
          if (p.name !== name) continue;
          for (const [l, x, y] of p.throws || []) {
            const q = x != null ? { x, y } : labelPos(l);
            if (q) dots.push({ x: q.x, y: q.y, c: color });
          }
        }
      }
      players.forEach((pl, idx) => {
        if (pl.name !== name) return;
        matchLog.filter(e => e.p === idx).forEach(e => e.labels.forEach((l, i) => {
          const q = (e.pos && e.pos[i]) || labelPos(l);
          if (q) dots.push({ x: q.x, y: q.y, c: color });
        }));
      });
      return dots;
    }

    function playerWeakness(name) {
      const counts = { total: 0, miss: 0, d: 0, t: 0 };
      for (const h of loadMatchHistory()) {
        for (const p of h.players) {
          if (p.name !== name) continue;
          for (const [l] of p.throws || []) {
            if (l.startsWith('PRO:')) continue;
            counts.total++;
            if (l === 'MISS') counts.miss++;
            else if (l.startsWith('T')) counts.t++;
            else if (l.startsWith('D')) counts.d++;
          }
        }
      }
      if (!counts.total) return '<div style="font-size:0.75rem;color:var(--subtext);">Noch keine Daten</div>';
      const pc = x => Math.round(x / counts.total * 100) + ' %';
      return `<div style="font-size:0.8rem;">Fehlwürfe ${pc(counts.miss)} · Doppel ${pc(counts.d)} · Triple ${pc(counts.t)} <span style="color:var(--subtext);">(${counts.total} Würfe)</span></div>`;
    }

    function formSvg() {
      const hist = loadMatchHistory().slice().reverse();
      const names = [...new Set(hist.flatMap(h => h.players.map(p => p.name)))];
      const series = names.map(n => {
        const avgs = [];
        for (const h of hist) { const pl = h.players.find(p => p.name === n); if (pl) avgs.push(Number(pl.avg) || 0); }
        return { n, vals: avgs.map((_, i) => { const w = avgs.slice(Math.max(0, i - 4), i + 1); return w.reduce((a, b) => a + b, 0) / w.length; }) };
      }).filter(s => s.vals.length >= 2);
      if (!series.length) return '<div style="font-size:0.75rem;color:var(--subtext);">Mindestens zwei Matches pro Spieler nötig</div>';
      const w = 300, h = 120, max = Math.max(60, ...series.flatMap(s => s.vals));
      const lines = series.map((s, si) => {
        const color = (loadProfiles()[s.n] || {}).color || PALETTE[si % PALETTE.length];
        const pts = s.vals.map((v, i) => `${(i / (s.vals.length - 1)) * w},${h - (v / max) * (h - 8) - 4}`).join(' ');
        return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>`;
      }).join('');
      const legend = series.map((s, si) => {
        const color = (loadProfiles()[s.n] || {}).color || PALETTE[si % PALETTE.length];
        return `<span style="color:${color};margin-right:8px;">■ ${esc(s.n)} (${s.vals[s.vals.length - 1].toFixed(1)})</span>`;
      }).join('');
      return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="120" preserveAspectRatio="none" style="background:#0f0c1f;border-radius:6px;">${lines}</svg>
        <div style="font-size:0.7rem;margin-top:4px;">${legend}</div>
        <div style="font-size:0.6rem;color:var(--subtext);">Gleitender Durchschnitt über die letzten 5 Matches</div>`;
    }

    const FIELD_TARGETS = [];
    for (let n = 1; n <= 20; n++) FIELD_TARGETS.push('T' + n, 'D' + n, String(n));
    FIELD_TARGETS.push('D-BULL');
    let trainerMode = 'checkout';

    function loadFieldTraining() {
      try { return JSON.parse(localStorage.getItem('neural_field_training')) || {}; } catch (e) { return {}; }
    }

    function fieldSpoken(label) {
      const de = voiceLang.startsWith('de');
      if (label === 'D-BULL') return de ? 'Doppel Bull' : 'Double bull';
      const m = label.match(/^([TD]?)(\d+)$/);
      const word = m[1] === 'T' ? 'Triple' : m[1] === 'D' ? (de ? 'Doppel' : 'Double') : '';
      return (word ? word + ' ' : '') + m[2];
    }

    function openTrainer(mode = trainerMode) {
      trainerMode = mode;
      nextTrainer();
      document.getElementById('trainer-modal').classList.add('active');
    }

    function setTrainerMode(m) {
      trainerMode = m;
      nextTrainer();
    }

    function nextTrainer() {
      if (trainerMode === 'field') {
        trainerTarget = FIELD_TARGETS[Math.floor(Math.random() * FIELD_TARGETS.length)];
        const spoken = fieldSpoken(trainerTarget);
        speakText(spoken, spoken);
      } else {
        trainerTarget = 2 + Math.floor(Math.random() * 169);
        const spoken = voiceLang.startsWith('de') ? `Restpunkte ${trainerTarget}` : `${trainerTarget} remaining`;
        speakText(spoken, spoken);
      }
      renderTrainer();
    }

    function weaknessLines() {
      const ft = loadFieldTraining();
      const rated = Object.entries(ft).filter(([, v]) => v[1] >= 5)
        .map(([k, [h, t]]) => ({ k, rate: h / t, h, t }))
        .sort((a, b) => a.rate - b.rate).slice(0, 5);
      if (!rated.length) return '<div style="font-size:0.75rem;color:var(--subtext);">Mindestens 5 Versuche pro Feld nötig</div>';
      return rated.map(r => `<div style="font-size:0.8rem;">${esc(r.k)}: <strong>${Math.round(r.rate * 100)} %</strong> <span style="color:var(--subtext);">(${r.h}/${r.t})</span></div>`).join('');
    }

    function renderTrainer() {
      const tabs = `<div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;">
          <button class="icon-btn${trainerMode === 'checkout' ? ' active-music' : ''}" onclick="setTrainerMode('checkout')">Restpunkte</button>
          <button class="icon-btn${trainerMode === 'field' ? ' active-music' : ''}" onclick="setTrainerMode('field')">Feld-Training</button>
        </div>`;
      let body;
      if (trainerMode === 'field') {
        const ft = loadFieldTraining()[trainerTarget] || [0, 0];
        body = `
          <div style="font-size:0.7rem;color:var(--subtext);">ZIEL</div>
          <div style="font-size:3rem;font-weight:800;color:var(--accent);">${trainerTarget}</div>
          <div style="font-size:0.75rem;color:var(--subtext);margin-bottom:6px;">Dieses Feld: ${ft[0]} / ${ft[1]} getroffen</div>
          <div style="font-size:0.7rem;color:var(--subtext);margin-top:10px;">SCHWÄCHEN (ALLE SPIELE)</div>
          ${weaknessLines()}`;
      } else {
        const route = CHECKOUTS[trainerTarget] || 'kein Standard-Checkout, Doppel treffen';
        body = `
          <div style="font-size:0.7rem;color:var(--subtext);">RESTPUNKTE</div>
          <div style="font-size:3rem;font-weight:800;color:var(--accent);">${trainerTarget}</div>
          <div style="font-size:0.9rem;margin:6px 0;">${route}</div>
          <div style="font-size:0.75rem;color:var(--subtext);margin-bottom:12px;">Treffer: ${trainerOk} / ${trainerTries}</div>`;
      }
      document.getElementById('trainer-body').innerHTML = `
        <div style="text-align:center;">${tabs}${body}
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;">
            <button class="icon-btn" onclick="trainerResult(true)">✔ Getroffen</button>
            <button class="icon-btn" onclick="trainerResult(false)">✖ Verfehlt</button>
            <button class="icon-btn" onclick="nextTrainer()">Nächster</button>
          </div>
        </div>`;
    }

    function trainerResult(ok) {
      if (trainerMode === 'field') {
        const ft = loadFieldTraining();
        const [h, t] = ft[trainerTarget] || [0, 0];
        ft[trainerTarget] = [h + (ok ? 1 : 0), t + 1];
        try { localStorage.setItem('neural_field_training', JSON.stringify(ft)); } catch (e) {}
      } else {
        trainerTries++;
        if (ok) trainerOk++;
      }
      nextTrainer();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light-mode');
      const isLight = document.documentElement.classList.contains('light-mode');
      document.getElementById('theme-btn').innerText = isLight ? '☀️' : '🌙';
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function playAudioAnnounce(text, type = 'score') {
      if (!soundEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === '180') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
        } else if (type === 'bust') {
          osc.frequency.setValueAtTime(150, ctx.currentTime);
        } else {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
        }
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}

      speakText(text);
    }

    const SPEECH_DE = {
      'Bust!': 'Überworfen!',
      'ONE HUNDRED AND EIGHTY!': 'Einhundertachtzig!',
      'Game and Leg!': 'Leg gewonnen!',
      'Game and Set!': 'Satz gewonnen!',
      'Game, Shot, and Match!': 'Spiel, Satz und Sieg!'
    };

    function translateAnnouncement(text, lang) {
      if (!lang.startsWith('de')) return text;
      const points = text.match(/^(\d+) points!$/);
      if (points) return points[1] + ' Punkte!';
      return SPEECH_DE[text] || text;
    }

    function speakText(text, sampleOverride) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const voice = speechSynthesis.getVoices().find(v => v.voiceURI === voiceURI) || null;
      const lang = voice ? voice.lang : (voiceLang || 'en-US');
      const msg = new SpeechSynthesisUtterance(sampleOverride || translateAnnouncement(text, lang));
      msg.lang = lang;
      if (voice) msg.voice = voice;
      msg.pitch = 0.9;
      msg.rate = 1.0;
      window.speechSynthesis.speak(msg);
    }

    function previewVoice() {
      const sample = voiceLang.startsWith('de') ? 'Hallo, so klingt die Ansage.' : 'Hello, this is how the announcer sounds.';
      speakText(sample, sample);
    }

    function loadVoiceLanguages() {
      if (!('speechSynthesis' in window)) return;
      const voices = speechSynthesis.getVoices();
      if (!voices.length) {
        document.getElementById('voice-lang').replaceChildren(new Option('keine Stimmen gefunden', ''));
        document.getElementById('voice-name').replaceChildren(new Option('–', ''));
        return;
      }
      const langs = [...new Set(voices.map(v => v.lang))].sort();
      const names = new Intl.DisplayNames([navigator.language], { type: 'language' });
      const sel = document.getElementById('voice-lang');
      sel.replaceChildren(...langs.map(l => {
        let label = l;
        try { label = names.of(l) + ' (' + l + ')'; } catch (e) {}
        return new Option(label, l);
      }));
      if (!langs.includes(voiceLang)) {
        voiceLang = langs.find(l => l.startsWith(navigator.language.slice(0, 2))) || langs[0];
      }
      sel.value = voiceLang;
      populateVoiceSelect(voiceLang);
    }

    function populateVoiceSelect(lang) {
      voiceLang = lang;
      localStorage.setItem('neural_voice_lang', lang);
      const list = speechSynthesis.getVoices().filter(v => v.lang === lang);
      if (!list.some(v => v.voiceURI === voiceURI)) {
        voiceURI = list.length ? list[0].voiceURI : '';
        localStorage.setItem('neural_voice_uri', voiceURI);
      }
      const sel = document.getElementById('voice-name');
      sel.replaceChildren(...(list.length
        ? list.map(v => new Option(v.name, v.voiceURI))
        : [new Option('Standard', '')]));
      sel.value = voiceURI;
    }

    function setVoiceName(uri) {
      voiceURI = uri;
      localStorage.setItem('neural_voice_uri', uri);
    }

    function selectMode(mode) {
      gameMode = mode;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`m-${mode}`).classList.add('active');
      resetMatch();
    }

    function startScoreFor(name) {
      const base = gameMode === '301' ? 301 : 501;
      return base + (Number(loadProfiles()[name]?.handicap) || 0);
    }

    function resetLegScores() {
      players.forEach(p => {
        p.score = startScoreFor(p.name);
        p.points = 0;
        p.cricket = crickBlank();
        p.atcTarget = 1;
        p.atcDone = false;
      });
    }

    function resetMatch() {
      activePlayer = 0;
      startingPlayerOfLeg = 0;
      turnDarts = [];
      turnHistory = [];
      matchLog = [];
      legNo = 1;
      matchStartTs = null;
      multiplier = 'S';
      buildPlayersArray();
      renderScoreboard();
      updateTurnUI();
      scheduleBot();
    }

    function setMultiplier(m) {
      multiplier = m;
      document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById(`mod-${m}`).classList.add('selected');
    }

    function renderKeypad() {
      const grid = document.getElementById('keypad');
      grid.innerHTML = '';
      for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = 'num-btn';
        btn.innerText = i;
        btn.onclick = () => throwDart(i);
        grid.appendChild(btn);
      }
      const bull = document.createElement('button');
      bull.className = 'num-btn';
      bull.style.color = 'var(--red-peg)';
      bull.innerText = 'BULL';
      bull.onclick = () => throwDart(25);
      grid.appendChild(bull);

      const miss = document.createElement('button');
      miss.className = 'num-btn';
      miss.innerText = 'MISS';
      miss.onclick = () => throwDart(0);
      grid.appendChild(miss);
    }

    function throwDart(val) {
      if (turnDarts.length >= 3 || players[activePlayer]?.bot) return;
      let score = val;
      let label = val.toString();

      if (val === 25) {
        if (multiplier === 'T') return;
        score = multiplier === 'D' ? 50 : 25;
        label = multiplier === 'D' ? 'D-BULL' : 'BULL';
      } else if (val > 0) {
        const multVal = multiplier === 'D' ? 2 : (multiplier === 'T' ? 3 : 1);
        score = val * multVal;
        label = (multiplier !== 'S' ? multiplier : '') + val;
      } else {
        label = 'MISS';
        score = 0;
      }

      turnDarts.push({ score, label });
      setMultiplier('S');
      updateTurnUI();
    }

    // SCAN-AI: photo of the board -> Gemini Flash-Lite via the proxy -> darts of this turn.
    // The model only finds positions (bull centre, the outer edge of segment 20 and
    // each dart tip). The app computes sector and ring itself, because the model is
    // unreliable at reading rings and sectors but accurate at finding points.
    // Clear reads are committed at once (UNDO reverts). Reads too close to a ring or
    // sector line stay pending in the input until NEXT PLAYER is pressed.
    const SCAN_PROXY = 'https://glow-up-gemini.replit.app';
    const SCAN_MODEL = 'gemini-3.5-flash-lite';
    const SCAN_ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
    const SCAN_PROMPT = 'This photo shows a dartboard with darts stuck in it. Give positions normalized to 0-1000 ' +
      '(0,0 = top-left corner, 1000,1000 = bottom-right corner of the photo). ' +
      '"bull": the exact centre of the board (the bullseye). ' +
      '"twenty_outer": a point on the outer edge of the board, at the middle of the segment labelled 20 (the segment at the top when the board is upright). ' +
      '"darts": for every dart stuck in the board, the point where the dart enters the board. ' +
      'Answer ONLY with JSON: {"bull":{"x":0,"y":0},"twenty_outer":{"x":0,"y":0},"darts":[{"x":0,"y":0}]}';

    function setScanStatus(text, cls) {
      const el = document.getElementById('scan-status');
      el.textContent = text;
      el.className = 'scan-status' + (cls ? ' ' + cls : '');
    }

    const SCAN_PROMPT_DARTS = 'This photo shows a dartboard with darts stuck in it. For every dart stuck in the board, give the point where the dart enters the board, ' +
      'normalized to 0-1000 (0,0 = top-left corner, 1000,1000 = bottom-right corner of the photo). ' +
      'Answer ONLY with JSON: {"darts":[{"x":0,"y":0}]}';

    function loadPhoto(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }

    function photoCanvas(img, maxSide = 768) {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c;
    }

    // Returns { darts:[{score,label}], safe:boolean } or null when the geometry is not usable.
    function scoreFromPoints(bull, outer20, darts) {
      if (!bull || !outer20 || !Array.isArray(darts)) return null;
      const R = Math.hypot(outer20.x - bull.x, outer20.y - bull.y);
      if (!(R >= 200)) return null; // board must fill at least a fifth of the photo
      const a20 = Math.atan2(outer20.y - bull.y, outer20.x - bull.x);
      const out = [];
      let safe = true;
      const margin = 0.03; // model positions are about 1-2% off, so anything near a ring line needs a confirm tap
      for (const d of darts.slice(0, 3)) {
        const dx = d.x - bull.x, dy = d.y - bull.y;
        const dist = Math.hypot(dx, dy) / R;
        let ang = Math.atan2(dy, dx) - a20;
        while (ang < -Math.PI) ang += 2 * Math.PI;
        while (ang >= Math.PI) ang -= 2 * Math.PI;
        const step = Math.PI / 10; // 18 degrees per segment
        let idx = Math.round(ang / step);
        const offset = Math.abs(ang - idx * step);
        idx = ((idx % 20) + 20) % 20;
        const sector = SCAN_ORDER[idx];
        // Distance to the nearest ring line and segment line
        const rings = [0.0373, 0.0935, 0.582, 0.629, 0.953, 1.0];
        if (rings.some(r => Math.abs(dist - r) < margin)) safe = false;
        if (step / 2 - offset < 0.035) safe = false; // within ~2 degrees of a segment line
        let score, label;
        if (dist > 1.0) { score = 0; label = 'MISS'; safe = false; }
        else if (dist <= 0.0373) { score = 50; label = 'D-BULL'; }
        else if (dist <= 0.0935) { score = 25; label = 'BULL'; }
        else if (dist >= 0.582 && dist <= 0.629) { score = sector * 3; label = 'T' + sector; }
        else if (dist >= 0.953) { score = sector * 2; label = 'D' + sector; }
        else { score = sector; label = String(sector); }
        out.push({ score, label, pos: { x: dist * Math.cos(ang - Math.PI / 2), y: dist * Math.sin(ang - Math.PI / 2) } });
      }
      return { darts: out, safe };
    }

    let scan = null;
    let previewRows = [];
    let previewSafe = true;

    // Both axes in one frame where the longer photo side is 1000, so rings stay round
    function uniformFromPixels(px, py) {
      const S = Math.max(scan.canvas.width, scan.canvas.height);
      return { x: px / S * 1000, y: py / S * 1000 };
    }

    function uniformFromNorm(x, y) {
      return uniformFromPixels(x / 1000 * scan.canvas.width, y / 1000 * scan.canvas.height);
    }

    async function scanDartsPhoto(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file || players[activePlayer]?.bot) return;
      try {
        scan = { canvas: photoCanvas(await loadPhoto(file)), bull: null, outer: null };
      } catch (e) {
        setScanStatus('❌ Foto konnte nicht geladen werden.', 'bad');
        return;
      }
      drawCalib();
      document.getElementById('calib-modal').classList.add('active');
    }

    function drawCalib() {
      const cv = document.getElementById('calib-canvas');
      cv.width = scan.canvas.width;
      cv.height = scan.canvas.height;
      const g = cv.getContext('2d');
      g.drawImage(scan.canvas, 0, 0);
      const mark = (pt, label, color) => {
        if (!pt) return;
        g.beginPath(); g.arc(pt.x, pt.y, 8, 0, Math.PI * 2); g.fillStyle = color; g.fill();
        g.font = 'bold 22px sans-serif'; g.fillText(label, pt.x + 12, pt.y - 10);
      };
      mark(scan.bull, 'Bull', '#f87171');
      mark(scan.outer, 'Segment 20', '#67e8f9');
      document.getElementById('calib-hint').textContent =
        !scan.bull ? '1. Tippe auf die Mitte der Scheibe (Bull)' :
        !scan.outer ? '2. Tippe auf die Außenkante von Segment 20 (oben)' :
        'Bereit. Jetzt scannen oder neu antippen.';
      document.getElementById('calib-go').disabled = !(scan.bull && scan.outer);
    }

    function calibTap(e) {
      if (!scan) return;
      const cv = document.getElementById('calib-canvas');
      const r = cv.getBoundingClientRect();
      const pt = { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height };
      if (!scan.bull) scan.bull = pt;
      else if (!scan.outer) scan.outer = pt;
      else { scan.bull = pt; scan.outer = null; }
      drawCalib();
    }

    async function runScan(useCalib) {
      closeModals();
      setScanStatus('📷 Foto wird analysiert …');
      try {
        const b64 = scan.canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
        const res = await fetch(SCAN_PROXY + '/gemini/models/' + SCAN_MODEL + '/generateContent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [ { text: useCalib ? SCAN_PROMPT_DARTS : SCAN_PROMPT }, { inline_data: { mime_type: 'image/jpeg', data: b64 } } ] }],
            generationConfig: { responseMimeType: 'application/json', temperature: 0 }
          })
        });
        if (!res.ok) throw new Error('Proxy HTTP ' + res.status);
        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts.map(p => p.text || '').join(''));
        if (!parsed.darts || parsed.darts.length === 0) { setScanStatus('Keine Pfeile erkannt. Foto näher ranhalten.', 'warn'); return; }
        const bullU = useCalib ? uniformFromPixels(scan.bull.x, scan.bull.y) : uniformFromNorm(parsed.bull.x, parsed.bull.y);
        const outerU = useCalib ? uniformFromPixels(scan.outer.x, scan.outer.y) : uniformFromNorm(parsed.twenty_outer.x, parsed.twenty_outer.y);
        const dartsU = parsed.darts.slice(0, 3).map(d => uniformFromNorm(d.x, d.y));
        const r = scoreFromPoints(bullU, outerU, dartsU);
        if (!r) { setScanStatus('⚠️ Scheibe nicht sicher erkannt. Bitte kalibrieren.', 'bad'); return; }
        previewRows = r.darts.map((d, i) => ({ label: d.label, pos: d.pos, pt: dartsU[i], bullU, outerU }));
        previewSafe = r.safe;
        renderPreview();
        document.getElementById('preview-modal').classList.add('active');
        setScanStatus('');
      } catch (e) {
        console.log('scan failed', e);
        setScanStatus('❌ Scan fehlgeschlagen. Bitte manuell eingeben.', 'bad');
      }
    }

    function parseLabel(raw) {
      const s = String(raw).trim().toUpperCase().replace(/\s+/g, '');
      if (s === 'BULL') return { score: 25, label: 'BULL' };
      if (s === 'D-BULL' || s === 'DBULL') return { score: 50, label: 'D-BULL' };
      if (s === 'MISS' || s === '0') return { score: 0, label: 'MISS' };
      const m = s.match(/^([TDS]?)(\d{1,2})$/);
      if (!m) return null;
      const n = Number(m[2]);
      if (n < 1 || n > 20) return null;
      const mult = m[1] === 'T' ? 3 : m[1] === 'D' ? 2 : 1;
      return { score: n * mult, label: (m[1] === 'S' ? '' : m[1]) + n };
    }

    function drawPreviewCanvas() {
      const base = scan.canvas;
      const cv = document.getElementById('preview-canvas');
      cv.width = base.width;
      cv.height = base.height;
      const g = cv.getContext('2d');
      g.drawImage(base, 0, 0);
      const k = Math.max(base.width, base.height) / 1000;
      const mark = (pt, text, color) => {
        g.beginPath(); g.arc(pt.x * k, pt.y * k, 9, 0, Math.PI * 2); g.lineWidth = 3; g.strokeStyle = color; g.stroke();
        g.font = 'bold 24px sans-serif'; g.fillStyle = color; g.fillText(text, pt.x * k + 12, pt.y * k - 10);
      };
      if (previewRows.length) {
        mark(previewRows[0].bullU, 'Bull', '#f87171');
        mark(previewRows[0].outerU, '20', '#67e8f9');
      }
      previewRows.forEach((row, i) => { if (row.pt) mark(row.pt, (i + 1) + ': ' + row.label, '#fbbf24'); });
    }

    function refreshPreviewTotals() {
      const valid = previewRows.every(r => r.parsed);
      const total = previewRows.reduce((a, r) => a + (r.parsed ? r.parsed.score : 0), 0);
      document.getElementById('preview-total').textContent = valid ? 'Summe: ' + total : '⚠️ Ungültiges Feld, bitte korrigieren';
      document.getElementById('preview-apply').disabled = !valid;
      document.getElementById('preview-commit').disabled = !valid;
    }

    function renderPreview() {
      previewRows.forEach(r => { r.parsed = parseLabel(r.label); });
      document.getElementById('preview-status').textContent = previewSafe
        ? 'Alle Pfeile klar erkannt. Korrigiere bei Bedarf das Feld.'
        : '⚠️ Mindestens ein Pfeil liegt knapp an einer Linie. Bitte prüfen.';
      document.getElementById('preview-list').innerHTML = previewRows.map((r, i) => `
        <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:0.85rem;">
          <span style="width:20px;">${i + 1}.</span>
          <input data-pi="${i}" value="${esc(r.label)}" style="width:110px;">
        </div>`).join('');
      document.querySelectorAll('#preview-list input').forEach(inp => inp.addEventListener('input', () => {
        const row = previewRows[Number(inp.dataset.pi)];
        row.label = inp.value;
        row.parsed = parseLabel(inp.value);
        inp.style.borderColor = row.parsed ? '' : '#f87171';
        drawPreviewCanvas();
        refreshPreviewTotals();
      }));
      drawPreviewCanvas();
      refreshPreviewTotals();
    }

    function rescanFromPreview() {
      closeModals();
      drawCalib();
      document.getElementById('calib-modal').classList.add('active');
    }

    function applyPreview(commit) {
      if (previewRows.some(r => !r.parsed)) return;
      turnDarts = previewRows.map(r => ({ score: r.parsed.score, label: r.parsed.label, pos: r.pos }));
      closeModals();
      updateTurnUI();
      const names = turnDarts.map(d => d.label).join(' · ');
      const total = turnDarts.reduce((a, d) => a + d.score, 0);
      if (commit) {
        confirmTurn();
        setScanStatus('✅ ' + names + ' = ' + total + ' eingetragen (UNDO zum Zurücknehmen)');
      } else {
        setScanStatus('📋 ' + names + ' = ' + total + ' übernommen. NEXT PLAYER drücken.');
      }
    }

    document.getElementById('scan-status').addEventListener('click', () => { const el = document.getElementById('scan-status'); if (el.classList.contains('warn') && turnDarts.length) { turnDarts = []; updateTurnUI(); setScanStatus('Verworfen. Manuell eingeben.'); } });
    function submitProScore() {
      const input = document.getElementById('pro-score-input');
      const val = parseInt(input.value);
      if (isNaN(val) || val < 0 || val > 180 || players[activePlayer]?.bot) return;
      turnDarts = [{ score: val, label: `PRO:${val}` }];
      input.value = '';
      input.blur();
      confirmTurn();
    }

    function smartUndo() {
      if (turnDarts.length > 0) {
        turnDarts.pop();
        updateTurnUI();
      } else if (turnHistory.length > 0) {
        const lastTurn = turnHistory.pop();
        players = lastTurn.prevPlayers;
        activePlayer = lastTurn.playerIdx;
        startingPlayerOfLeg = lastTurn.startingPlayerOfLeg;
        matchLog.length = lastTurn.logLen;
        legNo = lastTurn.legNo;
        turnDarts = players[activePlayer].bot ? [] : [...lastTurn.darts];
        renderScoreboard();
        updateTurnUI();
        scheduleBot();
      }
    }

    function updateTurnUI() {
      const list = document.getElementById('dart-list');
      list.innerHTML = '';
      let turnTotal = 0;
      for (let i = 0; i < 3; i++) {
        const badge = document.createElement('span');
        badge.className = 'dart-badge';
        if (turnDarts[i]) {
          badge.innerText = turnDarts[i].label;
          turnTotal += turnDarts[i].score;
        } else {
          badge.innerText = '-';
        }
        list.appendChild(badge);
      }

      document.getElementById('turn-score').innerText = turnTotal;
      if (players.length === 0) return;
      const p = players[activePlayer];
      const guide = document.getElementById('checkout-guide');
      if (gameMode === '501' || gameMode === '301') {
        const rem = p.score - turnTotal;
        guide.innerText = CHECKOUTS[rem] ? `CHECKOUT: ${CHECKOUTS[rem]}` : (rem <= 1 ? "⚠️ BUST GEFAHR!" : "CHECKOUT: ---");
      } else if (gameMode === 'cricket') {
        guide.innerText = 'CRICKET: Ziele 15–20 und Bull schließen';
      } else if (gameMode === 'atc') {
        guide.innerText = `ATC: Ziel ${atcLabel(p)}`;
      }
    }

    function confirmTurn() {
      if (players.length === 0) return;
      const p = players[activePlayer];
      const startScore = p.score;
      const turnTotal = turnDarts.reduce((a, b) => a + b.score, 0);
      const isPro = turnDarts.length === 1 && turnDarts[0].label.startsWith('PRO:');
      const count = isPro ? 3 : turnDarts.length;
      const labels = turnDarts.map(d => d.label);

      if (!matchStartTs) matchStartTs = Date.now();
      const pos = turnDarts.map(d => d.pos || null);
      turnHistory.push({
        playerIdx: activePlayer,
        darts: [...turnDarts],
        logLen: matchLog.length,
        legNo: legNo,
        startingPlayerOfLeg: startingPlayerOfLeg,
        prevPlayers: JSON.parse(JSON.stringify(players))
      });

      if (gameMode === 'cricket') {
        applyCricket(p, labels);
        const won = crickWon(p);
        matchLog.push({ p: activePlayer, leg: legNo, start: 999, pts: 0, count, labels, pos, won, bust: false });
        if (won) { handleLegWin(p); return; }
      } else if (gameMode === 'atc') {
        applyAtc(p, labels);
        matchLog.push({ p: activePlayer, leg: legNo, start: 999, pts: 0, count, labels, pos, won: p.atcDone, bust: false });
        if (p.atcDone) {
          alert(`🎯 ${p.name} in ${((Date.now() - matchStartTs) / 1000).toFixed(1)} s durch!`);
          handleLegWin(p);
          return;
        }
      } else if (gameMode === '501' || gameMode === '301') {
        if (startScore - turnTotal === 0) {
          matchLog.push({ p: activePlayer, leg: legNo, start: startScore, pts: turnTotal, count, labels, pos, won: true, bust: false });
          p.score = 0;
          handleLegWin(p);
          return;
        } else if (startScore - turnTotal < 2) {
          matchLog.push({ p: activePlayer, leg: legNo, start: startScore, pts: 0, count, labels, pos, won: false, bust: true });
          playAudioAnnounce("Bust!", 'bust');
        } else {
          matchLog.push({ p: activePlayer, leg: legNo, start: startScore, pts: turnTotal, count, labels, pos, won: false, bust: false });
          p.score -= turnTotal;
          p.dartsThrown += count;
          p.totalScored += turnTotal;
          if (turnTotal > p.highestTurn) p.highestTurn = turnTotal;

          if (turnTotal === 180) playAudioAnnounce("ONE HUNDRED AND EIGHTY!", '180');
          else if (turnTotal >= 100) playAudioAnnounce(`${turnTotal} points!`, 'score');
          else playAudioAnnounce(`${turnTotal}`, 'score');
        }
      }

      turnDarts = [];
      activePlayer = (activePlayer + 1) % players.length;
      renderScoreboard();
      updateTurnUI();
      scheduleBot();
    }

    function handleLegWin(winner) {
      winner.legs++;
      legNo++;
      playAudioAnnounce("Game and Leg!");

      if (winner.legs >= targetLegs) {
        winner.sets++;
        playAudioAnnounce("Game and Set!");

        if (winner.sets >= targetSets) {
          playAudioAnnounce("Game, Shot, and Match!");
          saveMatchHistory(winner);
          if (activeTournamentMatch !== null) finishTournamentMatch(winner.name);
          alert(`🏆 ${winner.name} GEWINNT DAS MATCH! (${winner.sets} Sets / ${winner.legs} Legs)`);
          resetMatch();
          return;
        } else {
          alert(`🎉 ${winner.name} gewinnt den Satz!`);
          players.forEach(p => p.legs = 0);
        }
      } else {
        alert(`🎯 ${winner.name} holt sich das Leg!`);
      }

      resetLegScores();
      startingPlayerOfLeg = (startingPlayerOfLeg + 1) % players.length;
      activePlayer = startingPlayerOfLeg;
      turnDarts = [];
      renderScoreboard();
      updateTurnUI();
      scheduleBot();
    }

    function renderScoreboard() {
      const board = document.getElementById('scoreboard');
      board.innerHTML = '';
      players.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = `player-card ${idx === activePlayer ? 'active' : ''}`;
        const profile = loadProfiles()[p.name] || {};
        const prefix = profile.emoji || (p.bot ? '🤖' : '');
        let big = p.score;

        card.innerHTML = `
          <div class="player-name">${prefix} ${esc(p.name)} ${idx === startingPlayerOfLeg ? '🔴' : ''}</div>

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function avgOf(p) {
      return p.dartsThrown > 0 ? ((p.totalScored / p.dartsThrown) * 3).toFixed(1) : '0.0';
    }

    function playerStats(idx) {
      const entries = matchLog.filter(e => e.p === idx);
      const scoring = entries.filter(e => !e.bust);
      const wins = entries.filter(e => e.won);
      const first3 = scoring.slice(0, 3);
      const checkAttempts = entries.filter(e => e.start <= 170).length;
      let singles = 0, doubles = 0, triples = 0, misses = 0, known = 0;
      const nums = {};
      for (const e of entries) {
        for (const l of e.labels) {
          if (l.startsWith('PRO:')) continue;
          known++;
          if (l === 'MISS') { misses++; continue; }
          if (l.startsWith('T')) triples++;
          else if (l.startsWith('D')) doubles++;
          else singles++;
          const n = (l === 'BULL' || l === 'D-BULL') ? 25 : Number(l.replace(/^[TD]/, ''));
          if (n) nums[n] = (nums[n] || 0) + 1;
        }
      }
      const pct = x => known ? Math.round(x / known * 100) + '%' : '–';
      const legDarts = wins.map(w => entries.filter(e => e.leg === w.leg).reduce((a, e) => a + e.count, 0));
      return {
        first9: first3.length ? (first3.reduce((a, e) => a + e.pts, 0) / first3.length).toFixed(1) : '–',
        t100: scoring.filter(e => e.pts >= 100).length,
        t140: scoring.filter(e => e.pts >= 140).length,
        t180: scoring.filter(e => e.pts === 180).length,
        busts: entries.filter(e => e.bust).length,
        checkPct: checkAttempts ? Math.round(wins.length / checkAttempts * 100) + '%' : '–',
        best: wins.length ? Math.max(...wins.map(e => e.pts)) : '–',
        dpl: legDarts.length ? (legDarts.reduce((a, b) => a + b, 0) / legDarts.length).toFixed(1) : '–',
        doublePct: pct(doubles),
        triplePct: pct(triples),
        nums,
        spark: scoring.map(e => e.pts).slice(-30)
      };
    }

    function statBox(label, value) {
      return `<div style="background:var(--card-bg);border:1px solid var(--border-color);border-radius:6px;padding:6px;"><div style="font-size:0.6rem;color:var(--subtext);">${label}</div><div style="font-weight:700;">${value}</div></div>`;
    }

    function numberBars(nums) {
      const keys = [...Array.from({ length: 20 }, (_, i) => i + 1), 25];
      const max = Math.max(1, ...keys.map(k => nums[k] || 0));
      return keys.map(k => {
        const c = nums[k] || 0;
        const h = Math.round(c / max * 40);
        return `<div style="flex:1 0 16px;text-align:center;font-size:0.55rem;"><div style="height:44px;display:flex;align-items:flex-end;"><div style="width:100%;height:${h}px;background:var(--accent);border-radius:2px 2px 0 0;"></div></div>${k === 25 ? 'B' : k}<br><span style="color:var(--subtext);">${c}</span></div>`;
      }).join('');
    }

    function sparkline(vals) {
      if (vals.length < 2) return '<div style="font-size:0.7rem;color:var(--subtext);">Zu wenig Würfe für den Verlauf</div>';
      const w = 280, h = 50, max = Math.max(180, ...vals);
      const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - (v / max) * (h - 4) - 2}`).join(' ');
      return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="50" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`;
    }
