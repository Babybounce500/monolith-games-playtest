    const TOUR_KEY = 'neural_tournament';
    let activeTournamentMatch = null;
    let tournamentBackup = null;

    function tournamentLoad() {
      try { return JSON.parse(localStorage.getItem(TOUR_KEY)) || null; } catch (e) { return null; }
    }

    function tournamentSave(t) {
      try { localStorage.setItem(TOUR_KEY, JSON.stringify(t)); } catch (e) {}
    }

    function shuffled(a) {
      const r = [...a];
      for (let i = r.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [r[i], r[j]] = [r[j], r[i]];
      }
      return r;
    }

    function createTournament(size, format, names) {
      const list = shuffled(names).slice(0, size);
      const t = { size, format, matches: [], nextId: 1, groups: [] };
      const add = m => t.matches.push({ ...m, id: t.nextId++, winner: null });
      if (format === 'group') {
        for (let g = 0; g < size / 4; g++) {
          const members = list.slice(g * 4, g * 4 + 4);
          t.groups.push(members);
          for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) add({ stage: 'group', group: g, round: 0, a: members[i], b: members[j] });
        }
      } else {
        for (let i = 0; i < size; i += 2) add({ stage: 'ko', round: 0, a: list[i], b: list[i + 1] });
      }
      tournamentSave(t);
      return t;
    }

    function groupStandings(t, g) {
      const members = t.groups[g];
      const wins = Object.fromEntries(members.map(n => [n, 0]));
      const played = Object.fromEntries(members.map(n => [n, 0]));
      t.matches.filter(m => m.stage === 'group' && m.group === g && m.winner).forEach(m => {
        wins[m.winner]++;
        played[m.a]++;
        played[m.b]++;
      });
      const order = members.slice().sort((x, y) => wins[y] - wins[x] || x.localeCompare(y));
      return order.map(n => ({ name: n, wins: wins[n], played: played[n] }));
    }

    function advanceTournament(t) {
      const groupMatches = t.matches.filter(m => m.stage === 'group');
      if (t.format === 'group' && groupMatches.length && groupMatches.every(m => m.winner) && !t.matches.some(m => m.stage === 'ko')) {
        const tops = t.groups.map((_, g) => groupStandings(t, g).slice(0, 2).map(s => s.name));
        tops.forEach((top, g) => {
          const other = tops[(g + 1) % tops.length];
          t.matches.push({ id: t.nextId++, stage: 'ko', round: 0, a: top[0], b: other[1], winner: null });
        });
      }
      for (let r = 0; ; r++) {
        const round = t.matches.filter(m => m.stage === 'ko' && m.round === r);
        if (!round.length || !round.every(m => m.winner) || round.length === 1) break;
        if (t.matches.some(m => m.stage === 'ko' && m.round === r + 1)) continue;
        const winners = round.map(m => m.winner);
        for (let i = 0; i < winners.length; i += 2) {
          t.matches.push({ id: t.nextId++, stage: 'ko', round: r + 1, a: winners[i], b: winners[i + 1], winner: null });
        }
      }
      tournamentSave(t);
    }

    function tournamentRecord(winnerName) {
      const t = tournamentLoad();
      if (!t) return;
      const m = t.matches.find(x => x.id === activeTournamentMatch);
      if (!m || m.winner) return;
      m.winner = winnerName;
      advanceTournament(t);
    }

    function startTournamentMatch(id) {
      const t = tournamentLoad();
      const m = t && t.matches.find(x => x.id === id);
      if (!m || m.winner || activeTournamentMatch !== null) return;
      activeTournamentMatch = id;
      tournamentBackup = { names: tempPlayerNames, bot: botOn };
      tempPlayerNames = [m.a, m.b];
      botOn = false;
      closeModals();
      resetMatch();
      setScanStatus('🏆 Turnierspiel: ' + m.a + ' vs ' + m.b);
    }

    function finishTournamentMatch(winnerName) {
      tournamentRecord(winnerName);
      tempPlayerNames = tournamentBackup.names;
      botOn = tournamentBackup.bot;
      activeTournamentMatch = null;
      tournamentBackup = null;
    }

    function roundTitle(count) {
      if (count === 1) return 'Finale';
      if (count === 2) return 'Halbfinale';
      if (count === 4) return 'Viertelfinale';
      return count * 2 + 'er-Runde';
    }

    function openTournament() {
      renderTournament();
      document.getElementById('tournament-modal').classList.add('active');
    }

    function renderTournament() {
      const body = document.getElementById('tournament-body');
      const t = tournamentLoad();
      if (!t) {
        const names = [...new Set([...tempPlayerNames, ...Object.keys(loadProfiles())])];
        body.innerHTML = `
          <div class="setting-label">NEUES TURNIER</div>
          <div style="display:flex;gap:8px;margin-bottom:8px;">
            <select id="tour-size" class="setting-select" style="flex:1;"><option value="4">4 Spieler</option><option value="8" selected>8 Spieler</option><option value="16">16 Spieler</option></select>
            <select id="tour-format" class="setting-select" style="flex:1;"><option value="ko">K.O.-Baum</option><option value="group">Gruppen + K.O.</option></select>
          </div>
          <textarea id="tour-names" rows="8" style="width:100%;" placeholder="Ein Name pro Zeile">${esc(names.join('\n'))}</textarea>
          <div style="font-size:0.6rem;color:var(--subtext);margin:4px 0 8px;">Fehlen Namen, werden sie als „Spieler n“ ergänzt. Gruppen gibt es nur bei 8 oder 16.</div>
          <button class="icon-btn" onclick="startNewTournament()">Auslosen &amp; starten</button>`;
        return;
      }
      const ko = t.matches.filter(m => m.stage === 'ko');
      const last = ko.length ? Math.max(...ko.map(m => m.round)) : 0;
      const final = ko.filter(m => m.round === last);
      const champ = final.length === 1 && final[0].winner ? final[0].winner : null;
      const row = m => `
        <div style="font-size:0.8rem;padding:6px 0;border-bottom:1px solid var(--border-color);">
          <span style="${m.winner === m.a ? 'color:var(--accent);font-weight:700;' : ''}">${esc(m.a)}</span> vs
          <span style="${m.winner === m.b ? 'color:var(--accent);font-weight:700;' : ''}">${esc(m.b)}</span>
          ${m.winner ? '' : `<button class="icon-btn" style="float:right;" ${activeTournamentMatch !== null ? 'disabled' : ''} onclick="startTournamentMatch(${m.id})">▶ Spielen</button>`}
        </div>`;
      let html = champ ? `<div style="font-size:1.1rem;color:var(--accent);margin-bottom:8px;">🏆 Sieger: ${esc(champ)}</div>` : '';
      if (activeTournamentMatch !== null) html += '<div style="font-size:0.75rem;margin-bottom:6px;">Ein Spiel läuft gerade.</div>';
      if (t.format === 'group') {
        t.groups.forEach((_, g) => {
          html += `<div style="margin:10px 0 4px;font-size:0.75rem;color:var(--accent);font-weight:700;">GRUPPE ${g + 1}</div>`;
          html += groupStandings(t, g).map(s => `<div style="font-size:0.8rem;">${esc(s.name)} — ${s.wins} Siege · ${s.played} Spiele</div>`).join('');
          html += t.matches.filter(m => m.stage === 'group' && m.group === g).map(row).join('');
        });
      }
      for (let r = 0; r <= last; r++) {
        const round = ko.filter(m => m.round === r);
        if (!round.length) continue;
        html += `<div style="margin:12px 0 4px;font-size:0.75rem;color:var(--accent);font-weight:700;">${roundTitle(round.length)}</div>`;
        html += round.map(row).join('');
      }
      html += `<div style="margin-top:12px;"><button class="icon-btn" onclick="resetTournament()">Turnier löschen</button></div>`;
      body.innerHTML = html;
    }

    function startNewTournament() {
      const size = Number(document.getElementById('tour-size').value);
      const format = document.getElementById('tour-format').value;
      if (format === 'group' && size === 4) { alert('Gruppen gibt es nur bei 8 oder 16 Spielern.'); return; }
      const typed = document.getElementById('tour-names').value.split('\n').map(s => s.trim()).filter(Boolean);
      const names = [...new Set(typed)];
      for (let i = names.length; i < size; i++) names.push('Spieler ' + (i + 1));
      if (names.length > size) names.length = size;
      if (new Set(names).size !== names.length) { alert('Namen müssen eindeutig sein.'); return; }
      createTournament(size, format, names);
      renderTournament();
    }

    function resetTournament() {
      if (activeTournamentMatch !== null) { alert('Erst das laufende Spiel beenden.'); return; }
      if (!confirm('Turnier wirklich löschen?')) return;
      localStorage.removeItem(TOUR_KEY);
      renderTournament();
    }

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    init();
  </script>
</body>
</html>
